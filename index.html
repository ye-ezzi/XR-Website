<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 뷰어</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; overflow: hidden; font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; }
        #viewer { width: 100vw; height: 100vh; }
        /* WebGL 캔버스를 홈 이미지 위로 올림 */
        #viewer canvas { position: relative; z-index: 100; }

        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.2rem; z-index: 100; text-align: center; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* 시작하기 버튼 */
        .start-button { 
            position: absolute; 
            left: 50%; 
            bottom: 100px; 
            transform: translateX(-50%); 
            z-index: 200; 
            padding: 16px 48px; 
            background: rgba(255, 255, 255, 0.08); 
            color: #fff; 
            font-size: 16px; 
            line-height: 1; 
            border-radius: 999px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            letter-spacing: 0.02em; 
            font-family: inherit; 
            backdrop-filter: blur(14px) saturate(140%); 
            -webkit-backdrop-filter: blur(14px) saturate(140%); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.35); 
            border: none; 
            overflow: hidden; 
        }
        .start-button::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1.2px;
            border-radius: 999px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.5),
                rgba(255, 255, 255, 0.12)
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .start-button:hover, .start-button:focus-visible { background: rgba(255,255,255,0.14); outline: none; }
        .start-button:active { transform: translateX(-50%) scale(0.98); }

        /* 홈 이미지: 배경 레이어로 하향 */
        .home-image { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 50; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        .home-image.visible { opacity: 0.7; }
        
        /* 좌우 움직임 애니메이션: 3D 모델 좌우 이동 시 배경 */
        .movement-animation { 
            position: fixed; 
            inset: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 45; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
            pointer-events: none;
        }
        .movement-animation.visible { opacity: 1; }
        /* MP4 비디오가 화면에 완전히 꽉 채우도록 설정 */
        .movement-animation {
            overflow: hidden;
        }
        .movement-animation video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            transform: scale(1.1) !important;
            transform-origin: center !important;
        }

        /* Annotation overlay */
        .anno-layer { position: fixed; inset: 0; z-index: 220; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
        .anno-layer.visible { opacity: 1; }

        /* 텍스트 박스 */
        .anno-text { position: absolute; max-width: min(15rem, 40vw); color: #ffffff; font-size: 14px; line-height: 1.6; background: transparent; border: none; padding: 0; border-radius: 0; font-family: inherit; }
        .anno1 { top: 20%; right: 4%; text-align: left; }
        .anno2 { bottom: 16%; left: 8%; text-align: left; }

        /* line PNGs */
        .anno-line1 { position: absolute; right: 22%; top: 24%; width: clamp(14px, 10vw, 80px); height: auto; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
        .anno-line1.visible { opacity: 1; }
        .anno-line2 { position: absolute; left: 16%; bottom: 24%; width: clamp(18px, 20vw, 200px); height: auto; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
        .anno-line2.visible { opacity: 1; }

        /* Cooking mode modal (overlay above canvas) */
        .modal-wrap {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 260;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }

        /* 기본 modal 스타일 비활성화(중복 border 제거) */
        .modal {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center; /* 카드와 닫기 버튼을 동일 축으로 정렬 */
            width: auto;
            max-width: min(520px, 90vw);
            padding: 0; /* cooking-modal 내부 padding 사용 */
            border-radius: 20px;

            background: transparent; /* cooking-modal에만 glass 적용 */
            border: none;           /* 🚫 기존 border 제거 */
            box-shadow: none;       /* 🚫 inset shadow 제거 */

            color: #fff;
        }

        /* ✔ 진짜 Cooking modal */
        .cooking-modal {
            width: 370px;
            height: 477px;
            padding: 24px 24px 24px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);

            position: relative;
            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-top: 16px;
            margin-bottom: 8px;
            line-height: 1.4;
            z-index: 1;
        }

        .modal-description {
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.5;
            z-index: 1;
        }

        /* ✔ Glass gradient 1px border — 단 1개 */
        .cooking-modal::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;

            padding: 1px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.35),
                rgba(255, 255, 255, 0.10),
                rgba(255, 255, 255, 0.04)
            );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            mask-composite: exclude;

            pointer-events: none;
        }

        .cooking-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .cooking-image {
            width: 100%;
            object-fit: contain;
            border-radius: 16px;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
            z-index: 1;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #afafaf;
        }

        .dot.active {
            background: rgba(255, 140, 60, 1);
        }

        /* 버튼 단일 stroke */
        .next-button {
            width: 100%;
            padding: 14px 24px;
            background: rgba(255, 140, 60, 0.55);
            backdrop-filter: blur(12px) saturate(150%);
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(255,140,60,0.25);
            position: relative;
            z-index: 1;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        /* 버튼 1px glass border */
        .next-button::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: 12px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.461),
                rgba(255, 255, 255, 0.247),
                rgba(255,255,255,0.05)
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }


        .next-button:hover {
            background: rgba(255, 140, 60, 0.7);
            transform: translateY(-1px);
        }

        .next-button:active {
            transform: translateY(0);
        }

        .close-modal-btn {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* Close button gradient border */
        .close-modal-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: 50%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.35),
                rgba(255, 255, 255, 0.10),
                rgba(255, 255, 255, 0.04)
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(-50%) scale(1.05);
        }

        .close-modal-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* Mobile responsive design */
        @media (max-width: 768px) {
            /* 시작하기 버튼 모바일 최적화 */
            .start-button { 
                bottom: 60px; 
                padding: 14px 32px; 
                font-size: 18px; 
                border-width: 2px;
            }
            
            /* 텍스트 박스 모바일 최적화 - 2줄 표시 가능하게 */
            .anno-text { 
                font-size: 14px; 
                max-width: min(20rem, 50vw); 
                line-height: 1.4;
            }
            
            /* 모바일에서 텍스트 위치 조정 */
            .anno1 { 
                top: 24%; 
                right: 6%; 
            }
            .anno2 { 
                bottom: 24%; 
                left: 6%; 
            }
            
            /* 라인 이미지 크기 조정 - 3D 모델에 더 가깝게 */
            .anno-line1 { 
                width: clamp(12px, 8vw, 60px); 
                right: 25%; 
                top: 28%;
            }
            .anno-line2 { 
                width: clamp(15px, 15vw, 150px); 
                left: 20%; 
                bottom: 28%;
            }
            
            /* 모달 모바일 최적화 */
            .modal {
                align-items: center;
                width: auto;
                max-width: 85vw;
                padding: 0;
                margin: 20px;
            }
            .modal h3 { font-size: 18px; }
            .modal p { font-size: 13px; }
            .btn {
                padding: 12px 18px;
                font-size: 14px;
            }

            /* Cooking modal 모바일 최적화 */
            .cooking-modal {
                width: min(370px, 85vw);
                height: auto;
                min-height: 400px;
                padding: 28px 20px 20px;
            }

            .next-button {
                font-size: 16px;
                padding: 12px 20px;
            }

            .close-modal-btn {
                width: 44px;
                height: 44px;
                font-size: 22px;
                bottom: -56px;
            }
        }
        
        @media (max-width: 480px) {
            /* 작은 모바일 화면 최적화 */
            .start-button { 
                bottom: 40px; 
                padding: 12px 28px; 
                font-size: 16px;
            }
            
            .anno-text { 
                font-size: 11px; 
                max-width: min(16rem, 45vw); 
            }
            
            .anno-line1 { 
                width: clamp(20px, 14vw, 50px); 
                right: 22%; 
                top: 34%;
            }
            .anno-line2 { 
                width: clamp(22px, 30vw, 120px); 
                left: 10%; 
                bottom: 35%;
            }
            
            .modal {
                align-items: center;
                width: auto;
                max-width: 90vw;
                padding: 0;
            }
            .modal h3 { font-size: 16px; }
            .modal p { font-size: 12px; }

            /* Cooking modal 작은 모바일 최적화 */
            .cooking-modal {
                width: min(340px, 90vw);
                height: auto;
                min-height: 380px;
                padding: 24px 18px 18px;
            }

            .next-button {
                font-size: 15px;
                padding: 11px 18px;
            }

            .dot {
                width: 8px;
                height: 8px;
            }

            .dot.active {
                width: 8px;
                height: 8px;
            }

            .close-modal-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
                bottom: -52px;
            }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>로딩 중...</div>
    </div>
    <button class="start-button" id="startButton">스캔 시작하기</button>

    <!-- Annotation overlay -->
    <div id="annoLayer" class="anno-layer">
        <img id="line1Img" class="anno-line1" src="/images/line1.png" alt="line1" />
        <img id="line2Img" class="anno-line2" src="/images/line2.png" alt="line2" />
        <div id="line1Text" class="anno-text anno1"></div>
        <div id="line2Text" class="anno-text anno2"></div>
    </div>
    <img id="homeImage" class="home-image" src="/images/Home.jpg" alt="Home" />
    <div id="movementAnimation" class="movement-animation"></div>

    <!-- Cooking mode modal -->
    <div id="cookingModal" class="modal-wrap" style="display:none">
        <div class="modal-backdrop"></div>
        <div class="modal">
            <div class="cooking-modal">
                <!-- Modal title -->
                <h2 class="modal-title">상황에 맞는 레시피로 누구나<br>만들 수 있는 요리를 추천해드려요.</h2>

                <!-- Modal description -->
                <p class="modal-description">내가 가진 재료와 도구로 만드는 요리를 만들어보세요.</p>

                <!-- Modal step image -->
                <div class="cooking-image-container">
                    <img src="/images/modal step 1.png" alt="Step 1" class="cooking-image" />
                </div>

                <!-- Carousel dots -->
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>

                <!-- Next button -->
                <button id="cookStart" class="next-button">다음</button>
            </div>

            <!-- Close button -->
            <button class="close-modal-btn" onclick="document.getElementById('cookingModal').style.display='none'">
                <img src="/images/x.svg" alt="Close" style="width: 24px; height: 24px;" />
            </button>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
